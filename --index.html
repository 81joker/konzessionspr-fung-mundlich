child und was steht drauf? (Wiederholung zur Sicherheit)", "answer": "• Schild am Betriebssitz mit Firmenname, Adresse , Wagennummer.", "blocks": [{"type": "ul", "items": ["Schild am Betriebssitz mit Firmenname, Adresse , Wagennummer."]}]}, {"num": 127, "question": "Wie viele Zuschläge haben Wir?", "answer": "Ein Zuschlag beträgt 2 Euro.\nFür die Bestellung über Standplatztelefon ist ein Zuschlag 2 Euro zu\nverrechnen.\nFür mehr als 4 Personen wird ebenfalls ein Zuschlag von 2 Euro verrechnet.", "blocks": [{"type": "p_list", "paras": ["Ein Zuschlag beträgt 2 Euro. Für die Bestellung über Standplatztelefon ist ein Zuschlag 2 Euro zu verrechnen. Für mehr als 4 Personen wird ebenfalls ein Zuschlag von 2 Euro verrechnet."]}]}, {"num": 128, "question": "Was sind persönliche Fahrtenbücher?", "answer": "Aufzeichnung betrieblicher/priver Fahrten für Steuerzwecke. Für Taxis irrelevant.", "blocks": [{"type": "p_list", "paras": ["Aufzeichnung betrieblicher/priver Fahrten für Steuerzwecke. Für Taxis irrelevant."]}]}, {"num": 129, "question": "Wie fährt man von Wien nach Italien? (Beispielroute)", "answer": "• Flughafen nach Triest: A4 → S1 → A2 (Südautobahn) → durch Kärnten →\nGrenze Arnoldstein.", "blocks": [{"type": "ul", "items": ["Flughafen nach Triest: A4 → S1 → A2 (Südautobahn) → durch Kärnten → Grenze Arnoldstein."]}]}, {"num": 130, "question": "Grenzübergänge nach Italien, Ungarn, Deutschland, Slowenien?", "answer": "• Italien: Arnoldstein (A2), Thörl-Maglern (A2).\n• Ungarn: Nickelsdorf (A4), Klingenbach (S31).\n• Deutschland: Walserberg (A1), Suben (A8).\n• Slowenien: Spielfeld (A9).", "blocks": [{"type": "ul", "items": ["Italien: Arnoldstein (A2), Thörl-Maglern (A2).", "Ungarn: Nickelsdorf (A4), Klingenbach (S31).", "Deutschland: Walserberg (A1), Suben (A8).", "Slowenien: Spielfeld (A9)."]}]}, {"num": 131, "question": "Nennen Sie Donaukanalbrücken.", "answer": "• Schwedenbrücke, Marienbrücke, Salztorbrücke, Aspernbrücke.", "blocks": [{"type": "ul", "items": ["Schwedenbrücke, Marienbrücke, Salztorbrücke, Aspernbrücke."]}]}]}];

// Flatten
let GLOBAL = [];
let gi = 0;
DATA.forEach((sec, si) => {
  sec.questions.forEach(q => {
    GLOBAL.push({
      num: q.num,
      question: q.question,
      blocks: q.blocks,
      sectionIndex: si,
      sectionTitle: sec.title,
      id: 'q'+q.num
    });
    gi++;
  });
});

const STORAGE_KEY = 'taxi131_progress_v1';
function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ return {}; }
}
function saveProgress(p){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
let progress = loadProgress(); // { qnum: 'known' | 'unknown' }

function renderBlocksHTML(blocks){
  let html = '';
  blocks.forEach(b => {
    if(b.type === 'ul'){
      html += '<ul>' + b.items.map(it => '<li>'+escapeHtml(it)+'</li>').join('') + '</ul>';
    } else if(b.type === 'p_list'){
      html += b.paras.map(p => '<p>'+escapeHtml(p)+'</p>').join('');
    }
  });
  if(!html) html = '<p><em>Keine Details.</em></p>';
  return html;
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- Tabs ----------
const tabBtns = document.querySelectorAll('.tab-btn');
tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    tabBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('view-browse').style.display = tab === 'browse' ? 'block' : 'none';
    document.getElementById('view-trainer').classList.toggle('active', tab === 'trainer');
    if(tab === 'trainer'){ initTrainerDeck(); }
  });
});

// ---------- Section filter options ----------
const sectionFilter = document.getElementById('sectionFilter');
const trainerSectionFilter = document.getElementById('trainerSectionFilter');
DATA.forEach((sec, si) => {
  const opt = document.createElement('option');
  opt.value = si;
  opt.textContent = (si+1) + '. ' + sec.title + ' (' + sec.questions.length + ')';
  sectionFilter.appendChild(opt);
  const opt2 = opt.cloneNode(true);
  trainerSectionFilter.appendChild(opt2);
});

// ---------- Browse view ----------
const questionList = document.getElementById('questionList');
const searchBox = document.getElementById('searchBox');
const emptyMsg = document.getElementById('emptyMsg');

function renderBrowse(){
  const term = searchBox.value.trim().toLowerCase();
  const secFilter = sectionFilter.value;
  questionList.innerHTML = '';
  let anyShown = false;

  DATA.forEach((sec, si) => {
    if(secFilter !== 'all' && String(si) !== secFilter) return;

    const matches = sec.questions.filter(q => {
      if(!term) return true;
      const ansText = q.answer.toLowerCase();
      return q.question.toLowerCase().includes(term) || ansText.includes(term) || String(q.num).includes(term);
    });
    if(matches.length === 0) return;
    anyShown = true;

    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.innerHTML = (si+1)+'. '+escapeHtml(sec.title)+' <span class="count">'+matches.length+' Fragen</span>';
    questionList.appendChild(heading);

    matches.forEach(q => {
      const card = document.createElement('div');
      card.className = 'qcard';
      card.id = 'card-q'+q.num;
      const qDisplay = highlight(q.question, term);
      card.innerHTML = `
        <div class="qhead">
          <div class="qnum">#${q.num}</div>
          <div class="qtext">${qDisplay}</div>
          <div class="qmark">▾</div>
        </div>
        <div class="qbody"><div class="ans">${renderBlocksHTML(q.blocks)}</div></div>
      `;
      card.querySelector('.qhead').addEventListener('click', () => {
        card.classList.toggle('open');
        const body = card.querySelector('.qbody');
        body.style.maxHeight = card.classList.contains('open') ? body.scrollHeight + 'px' : '0px';
      });
      questionList.appendChild(card);
    });
  });

  emptyMsg.style.display = anyShown ? 'none' : 'block';
}

function highlight(text, term){
  const esc = escapeHtml(text);
  if(!term) return esc;
  const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return esc.replace(re, '<mark>$1</mark>');
}

searchBox.addEventListener('input', renderBrowse);
sectionFilter.addEventListener('change', renderBrowse);

document.getElementById('expandAllBtn').addEventListener('click', () => {
  document.querySelectorAll('.qcard').forEach(c => {
    c.classList.add('open');
    const body = c.querySelector('.qbody');
    body.style.maxHeight = body.scrollHeight + 'px';
  });
});
document.getElementById('collapseAllBtn').addEventListener('click', () => {
  document.querySelectorAll('.qcard').forEach(c => {
    c.classList.remove('open');
    c.querySelector('.qbody').style.maxHeight = '0px';
  });
});

// ---------- Trainer (flashcards) ----------
let deck = [];
let deckPos = 0;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function initTrainerDeck(){
  const secVal = trainerSectionFilter.value;
  let pool = GLOBAL.slice();
  if(secVal !== 'all'){
    pool = pool.filter(q => String(q.sectionIndex) === secVal);
  }
  deck = shuffle(pool);
  deckPos = 0;
  document.getElementById('doneScreen').style.display = 'none';
  document.getElementById('flashcardHolder').style.display = 'block';
  renderFlashcard();
}
trainerSectionFilter.addEventListener('change', initTrainerDeck);

function renderFlashcard(){
  const holder = document.getElementById('flashcardHolder');
  if(deckPos >= deck.length){
    showDoneScreen();
    return;
  }
  const q = deck[deckPos];
  document.getElementById('trainerCounter').textContent = (deckPos+1)+' / '+deck.length;
  document.getElementById('trainerProgress').style.width = Math.round(((deckPos)/deck.length)*100)+'%';

  holder.innerHTML = `
    <div class="flashcard" id="fcMain">
      <div class="fc-section">${escapeHtml(q.sectionTitle)} · Frage #${q.num}</div>
      <div class="fc-q">${escapeHtml(q.question)}</div>
      <div class="fc-ans">${renderBlocksHTML(q.blocks)}</div>
      <div class="fc-hint" id="fcHint">Antippen, um die Antwort zu zeigen</div>
    </div>
    <div class="trainer-actions">
      <button class="btn dontknow" id="btnDontKnow">❌ Nicht gewusst</button>
      <button class="btn know" id="btnKnow">✅ Gewusst</button>
    </div>
    <div class="trainer-nav">
      <button class="btn" id="btnPrev">← Zurück</button>
      <button class="btn" id="btnSkip">Überspringen →</button>
    </div>
  `;

  const card = document.getElementById('fcMain');
  card.addEventListener('click', () => {
    card.classList.toggle('flipped');
    document.getElementById('fcHint').textContent = card.classList.contains('flipped') ? 'Antippen, um zu verbergen' : 'Antippen, um die Antwort zu zeigen';
  });

  document.getElementById('btnKnow').addEventListener('click', (e) => {
    e.stopPropagation();
    markAndAdvance(q.num, 'known');
  });
  document.getElementById('btnDontKnow').addEventListener('click', (e) => {
    e.stopPropagation();
    markAndAdvance(q.num, 'unknown');
  });
  document.getElementById('btnSkip').addEventListener('click', (e) => {
    e.stopPropagation();
    deckPos++;
    renderFlashcard();
  });
  document.getElementById('btnPrev').addEventListener('click', (e) => {
    e.stopPropagation();
    if(deckPos>0){ deckPos--; renderFlashcard(); }
  });
}

function markAndAdvance(num, status){
  progress[num] = status;
  saveProgress(progress);
  updateStats();
  deckPos++;
  renderFlashcard();
}

function showDoneScreen(){
  document.getElementById('flashcardHolder').style.display = 'none';
  document.getElementById('trainerProgress').style.width = '100%';
  const done = document.getElementById('doneScreen');
  done.style.display = 'block';
  const knownInDeck = deck.filter(q => progress[q.num] === 'known').length;
  document.getElementById('doneText').textContent = `Du hast ${deck.length} Karten durchgesehen, ${knownInDeck} davon als "gewusst" markiert.`;
}
document.getElementById('restartTrainerBtn').addEventListener('click', initTrainerDeck);

// ---------- Stats ----------
function updateStats(){
  const total = GLOBAL.length;
  let known = 0, unknown = 0;
  GLOBAL.forEach(q => {
    if(progress[q.num] === 'known') known++;
    else if(progress[q.num] === 'unknown') unknown++;
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statKnown').textContent = known;
  document.getElementById('statUnknown').textContent = unknown;
  document.getElementById('statLeft').textContent = total - known - unknown;
}

// ---------- Init ----------
renderBrowse();
updateStats();
</script>
