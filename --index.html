<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxi Konzessionsprüfung – 131 Fragen</title>
<style>
:root{
  --bg:#0f1420;
  --bg2:#161d2e;
  --card:#1b2337;
  --card-hover:#212b43;
  --border:#2a3450;
  --text:#e8ecf5;
  --text-dim:#9aa5bd;
  --accent:#f5c518;
  --accent2:#3ea6ff;
  --good:#3ecf8e;
  --bad:#ff6b6b;
  --radius:14px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{min-height:100vh;}
a{color:var(--accent2);}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 80px;}
header.top{
  background:linear-gradient(180deg,#141b2c,#0f1420 90%);
  border-bottom:1px solid var(--border);
  padding:28px 0 18px;
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(6px);
}
header.top .wrap{padding-top:0;padding-bottom:0;}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;}
.brand h1{font-size:1.35rem;margin:0;font-weight:800;letter-spacing:.2px;}
.brand h1 span{color:var(--accent);}
.brand .sub{color:var(--text-dim);font-size:.85rem;margin-top:2px;}
.brand-ar{color:var(--text-dim);font-size:.82rem;margin-top:6px;direction:rtl;text-align:right;line-height:1.5;}

.tabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
.tab-btn{
  background:var(--card);border:1px solid var(--border);color:var(--text-dim);
  padding:9px 16px;border-radius:999px;cursor:pointer;font-size:.92rem;font-weight:600;
  transition:.15s;
}
.tab-btn:hover{color:var(--text);border-color:var(--accent2);}
.tab-btn.active{background:var(--accent);color:#161200;border-color:var(--accent);}

.statbar{
  display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;
}
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 16px;font-size:.85rem;color:var(--text-dim);flex:1;min-width:120px;
}
.stat b{display:block;font-size:1.3rem;color:var(--text);font-weight:800;}
.stat.good b{color:var(--good);}
.stat.bad b{color:var(--bad);}

main{padding-top:22px;}

.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.search-box{
  flex:1;min-width:220px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;color:var(--text);font-size:.95rem;
}
.search-box:focus{outline:none;border-color:var(--accent2);}
select.filter-select{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 12px;border-radius:10px;font-size:.9rem;
}
.btn{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:10px 16px;border-radius:10px;cursor:pointer;font-size:.9rem;font-weight:600;
  transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--accent2);}
.btn.primary{background:var(--accent);color:#161200;border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{color:var(--bad);}
.btn.danger:hover{border-color:var(--bad);}

.section-heading{
  margin:28px 0 12px;font-size:1.05rem;font-weight:800;color:var(--accent);
  display:flex;align-items:center;gap:10px;
}
.section-heading .count{
  font-weight:600;color:var(--text-dim);font-size:.8rem;background:var(--card);
  border:1px solid var(--border);padding:2px 10px;border-radius:999px;
}

.qcard{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;transition:.15s;
}
.qcard:hover{border-color:#3a4568;}
.qhead{
  display:flex;align-items:flex-start;gap:12px;padding:15px 16px;cursor:pointer;
}
.qnum{
  flex:0 0 auto;background:var(--bg2);color:var(--accent);font-weight:800;
  font-size:.8rem;border-radius:8px;padding:5px 9px;min-width:34px;text-align:center;
}
.qtext{flex:1;font-weight:650;font-size:.98rem;line-height:1.4;}
.qmark{flex:0 0 auto;color:var(--text-dim);font-size:.85rem;padding-top:2px;transition:.2s;}
.qcard.open .qmark{transform:rotate(180deg);}
.qbody{
  max-height:0;overflow:hidden;transition:max-height .25s ease;
  padding:0 16px;
}
.qcard.open .qbody{padding:0 16px 16px 62px;}
.qbody .ans p{margin:0 0 8px;color:#c6cee3;line-height:1.55;font-size:.93rem;}
.qbody .ans ul{margin:0 0 4px;padding-left:18px;color:#c6cee3;line-height:1.55;font-size:.93rem;}
.qbody .ans li{margin-bottom:6px;}
mark{background:rgba(245,197,24,.35);color:inherit;border-radius:3px;padding:0 2px;}

.empty-msg{color:var(--text-dim);text-align:center;padding:40px 0;font-size:.95rem;}

/* Flashcards */
.trainer{display:none;flex-direction:column;align-items:center;padding-top:6px;}
.trainer.active{display:flex;}
.trainer-top{display:flex;justify-content:space-between;width:100%;max-width:640px;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.progress-outer{flex:1;height:8px;background:var(--card);border-radius:99px;overflow:hidden;min-width:140px;border:1px solid var(--border);}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--accent2),var(--good));width:0%;transition:width .3s;}
.progress-label{font-size:.8rem;color:var(--text-dim);white-space:nowrap;}

.flashcard{
  width:100%;max-width:640px;min-height:280px;background:var(--card);
  border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
  padding:28px 26px;display:flex;flex-direction:column;cursor:pointer;
  position:relative;
}
.flashcard .fc-section{color:var(--accent2);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.flashcard .fc-q{font-size:1.18rem;font-weight:750;line-height:1.5;flex:1;display:flex;align-items:center;}
.flashcard .fc-hint{color:var(--text-dim);font-size:.8rem;text-align:center;margin-top:14px;}
.flashcard .fc-ans{display:none;border-top:1px dashed var(--border);margin-top:16px;padding-top:16px;}
.flashcard.flipped .fc-ans{display:block;}
.flashcard.flipped .fc-q{flex:0 0 auto;}
.flashcard .fc-ans p{margin:0 0 8px;color:#c6cee3;line-height:1.55;font-size:.95rem;}
.flashcard .fc-ans ul{margin:0 0 4px;padding-left:20px;color:#c6cee3;line-height:1.55;font-size:.95rem;}
.flashcard .fc-ans li{margin-bottom:6px;}

.trainer-actions{display:flex;gap:10px;margin-top:18px;width:100%;max-width:640px;flex-wrap:wrap;}
.trainer-actions .btn{flex:1;min-width:120px;font-size:.95rem;padding:13px 10px;}
.btn.know{border-color:var(--good);color:var(--good);}
.btn.know:hover{background:rgba(62,207,142,.1);}
.btn.dontknow{border-color:var(--bad);color:var(--bad);}
.btn.dontknow:hover{background:rgba(255,107,107,.1);}

.trainer-nav{display:flex;gap:8px;margin-top:12px;width:100%;max-width:640px;justify-content:space-between;}
.trainer-nav .btn{flex:1;}

.done-screen{max-width:520px;text-align:center;padding:40px 20px;}
.done-screen .big{font-size:2.4rem;margin-bottom:8px;}
.done-screen h2{margin:0 0 8px;}
.done-screen p{color:var(--text-dim);margin-bottom:20px;}

footer{color:var(--text-dim);text-align:center;font-size:.8rem;padding:30px 0 10px;}

@media (max-width:560px){
  .brand h1{font-size:1.1rem;}
  .qbody.open{padding-left:16px;}
  .qcard.open .qbody{padding-left:16px;}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>🚕 Taxi <span>Konzessionsprüfung</span> Wien</h1>
        <div class="sub">Mündliche Prüfung · 131 Fragen · EasyCab Taxischule</div>

    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="browse">📖 Alle Fragen</button>

</header>

<main class="wrap">

  <div id="view-browse">

      <input id="searchBox" class="search-box" type="text" placeholder="🔍 Frage oder Antwort durchsuchen…">
      <select id="sectionFilter" class="filter-select">
        <option value="all">Alle Kapitel</option>
      </select>
      <button class="btn" id="expandAllBtn">Alle aufklappen</button>
      <button class="btn" id="collapseAllBtn">Alle zuklappen</button>
    </div>
    <div id="questionList"></div>
    <div class="empty-msg" id="emptyMsg" style="display:none;">Keine Treffer gefunden.</div>
  </div>

  <div id="view-trainer" class="trainer">
    <div class="trainer-top">
      <div class="progress-label" id="trainerCounter">1 / 131</div>
      <div class="progress-outer"><div class="progress-inner" id="trainerProgress"></div></div>
      <select id="trainerSectionFilter" class="filter-select">
        <option value="all">Alle Kapitel</option>
      </select>
    </div>

    <div id="flashcardHolder"></div>

    <div id="doneScreen" class="done-screen" style="display:none;">
      <div class="big">🎉</div>
      <h2>Runde geschafft!</h2>
      <p id="doneText"></p>
      <button class="btn primary" id="restartTrainerBtn">Nochmal von vorne</button>
    </div>
  </div>

</main>

te (z.B. FG \"Taxi- und Mietwagenunternehmungen\").", "Organe: Fachgruppenobmann/-frau, 2 Stellvertrete", "Funktionäre gewählte Unternehmern ,Fachgruppenausschuss,", "Fachgruppentagung (höchstes Organ)."]}]}, {"num": 12, "question": "Unterschied zwischen Fachgruppe, Fachverband und Fachorganisation?", "answer": "• Fachgruppe: Lokal/regional für ein spezielles Gewerbe (z.B. Wiener\nTaxifachgruppe).\n• Fachverband: Landesweite (bundesländerübergreifende) Vertretung einer\nBranche.\n• Fachorganisation: Oberbegriff für die 7 Sparten der WKO (bundesweit).", "blocks": [{"type": "ul", "items": ["Fachgruppe: Lokal/regional für ein spezielles Gewerbe (z.B. Wiener Taxifachgruppe).", "Fachverband: Landesweite (bundesländerübergreifende) Vertretung einer Branche.", "Fachorganisation: Oberbegriff für die 7 Sparten der WKO (bundesweit)."]}]}, {"num": 13, "question": "Wer ist Ihr gesetzlicher Interessenvertreter?", "answer": "• Die Wirtschaftskammer Österreich (WKO) vertritt die Interessen der\nUnternehmer.\n• Arbeiterkammer (AK) vertritt Arbeitnehmer. Gewerkschaft (z.B.\nvida) verhandelt Kollektivverträge.", "blocks": [{"type": "ul", "items": ["Die Wirtschaftskammer Österreich (WKO) vertritt die Interessen der Unternehmer.", "Arbeiterkammer (AK) vertritt Arbeitnehmer. Gewerkschaft (z.B. vida) verhandelt Kollektivverträge."]}]}, {"num": 14, "question": "Was sind die Aufgaben der WKO/Fachgruppe?", "answer": "• Vertretung der wirtschaftlichen, sozialen und fachlichen Interessen der\nMitglieder.\n• Beratung in Rechts-, Steuer- und Förderfragen.\n• Aus- und Weiterbildung.\n• Mitwirkung bei Gesetzen und Verordnungen.", "blocks": [{"type": "ul", "items": ["Vertretung der wirtschaftlichen, sozialen und fachlichen Interessen der Mitglieder.", "Beratung in Rechts-, Steuer- und Förderfragen.", "Aus- und Weiterbildung.", "Mitwirkung bei Gesetzen und Verordnungen."]}]}, {"num": 15, "question": "Werden Sie automatisch Mitglied der WKO?", "answer": "• Ja. Mit der Ausübung eines Gewerbes wird man automatisch und verpflichtend\nMitglied der zuständigen Fachgruppe und der WKO.", "blocks": [{"type": "ul", "items": ["Ja. Mit der Ausübung eines Gewerbes wird man automatisch und verpflichtend Mitglied der zuständigen Fachgruppe und der WKO."]}]}]}, {"title": "Arbeitsrecht & Kollektivvertrag (KV)", "questions": [{"num": 16, "question": "Was ist ein Kollektivvertrag (KV)? Wer schließt ihn ab?", "answer": "• Ein schriftlicher Tarifvertrag, der Mindestbedingungen für Arbeitsverhältnisse\nfestlegt.\n• Abgeschlossen zwischen den Sozialpartnern: Gewerkschaften (für Taxi: vida)\nund Fachverbänden der WKO.", "blocks": [{"type": "ul", "items": ["Ein schriftlicher Tarifvertrag, der Mindestbedingungen für Arbeitsverhältnisse festlegt.", "Abgeschlossen zwischen den Sozialpartnern: Gewerkschaften (für Taxi: vida) und Fachverbänden der WKO."]}]}, {"num": 17, "question": "Für wen gilt der Kollektivvertrag? (Geltungsbereich)", "answer": "• Für alle Arbeitgeber und Arbeitnehmer im Geltungsbereich\n(fachlich/räumlich), auch für Nicht-Mitglieder (Außenseiterwirkung) , .\nKollektivvertrag gilt für ganz Österreich.", "blocks": [{"type": "ul", "items": ["Für alle Arbeitgeber und Arbeitnehmer im Geltungsbereich (fachlich/räumlich), auch für Nicht-Mitglieder (Außenseiterwirkung) , . Kollektivvertrag gilt für ganz Österreich."]}]}, {"num": 18, "question": "Was wird im Kollektivvertrag geregelt? (Wichtige Bereiche)", "answer": "• Arbeitszeit und Ruhezeiten\n• Mindestlöhne/Gehälter\n• Zuschläge (Nacht, Sonntag, Feiertag, Überstunden)\n• Sonderzahlungen (Urlaubs-/Weihnachtsgeld)\n• Kündigungsfristen und -termine\n• Urlaubsanspruch", "blocks": [{"type": "ul", "items": ["Arbeitszeit und Ruhezeiten", "Mindestlöhne/Gehälter", "Zuschläge (Nacht, Sonntag, Feiertag, Überstunden)", "Sonderzahlungen (Urlaubs-/Weihnachtsgeld)", "Kündigungsfristen und -termine", "Urlaubsanspruch"]}]}, {"num": 19, "question": "Unterschied zwischen Kollektivvertrag, Arbeitsvertrag und Dienstzettel?", "answer": "• Arbeitsvertrag (auch Dienstvertrag genannt) :\n• Wird zwischen dem Arbeitnehmer und dem Arbeitgeber abgeschlossen.\n• Er kann freie Vereinbarungen enthalten, ( höherer Lohn, weniger\nArbeitszeit).\n• Er darf jedoch nur Besserstellung als im Kollektivvertrag enthalten.\n• Kollektivvertrag :\n• Wird zwischen der Wirtschaftskammer Österreich (WKÖ) und dem\nGewerkschaftsbund (ÖGB-VIDA) abgeschlossen.\n• Regelt bessere Entlohnung, bessere Arbeitszeiten und Mindestlohne.\n• Darf nur zugunsten der Arbeitnehmer geändert werden.\n• Dienstzettel: Schriftliche Bestätigung des AG über die wesentlichen\nKonditionen (muss spätestens 1 Monat nach Antritt ausgehändigt werden).", "blocks": [{"type": "ul", "items": ["Arbeitsvertrag (auch Dienstvertrag genannt) :", "Wird zwischen dem Arbeitnehmer und dem Arbeitgeber abgeschlossen.", "Er kann freie Vereinbarungen enthalten, ( höherer Lohn, weniger Arbeitszeit).", "Er darf jedoch nur Besserstellung als im Kollektivvertrag enthalten.", "Kollektivvertrag :", "Wird zwischen der Wirtschaftskammer Österreich (WKÖ) und dem Gewerkschaftsbund (ÖGB-VIDA) abgeschlossen.", "Regelt bessere Entlohnung, bessere Arbeitszeiten und Mindestlohne.", "Darf nur zugunsten der Arbeitnehmer geändert werden.", "Dienstzettel: Schriftliche Bestätigung des AG über die wesentlichen Konditionen (muss spätestens 1 Monat nach Antritt ausgehändigt werden)."]}]}, {"num": 20, "question": "Muss ein Arbeitsvertrag schriftlich sein?", "answer": "• Nein. Ein Arbeitsvertrag kann auch mündlich geschlossen werden. Der\nArbeitgeber ist aber verpflichtet, die wesentlichen Bedingungen schriftlich\nim Dienstzettel festzuhalten und auszuhändigen.", "blocks": [{"type": "ul", "items": ["Nein. Ein Arbeitsvertrag kann auch mündlich geschlossen werden. Der Arbeitgeber ist aber verpflichtet, die wesentlichen Bedingungen schriftlich im Dienstzettel festzuhalten und auszuhändigen."]}]}, {"num": 21, "question": "Welche Kündigungsarten gibt es?", "answer": "• Entlassung (Kündigung durch AG)\n• Vorzeitiger Austritt (Kündigung durch AN)\n• Einvernehmliche Auflösung\n• Auflösung während der Probezeit\n• Entlassung , Fristlose (außerordentliche) Kündigung aus wichtigem Grund\n(z.B. Diebstahl)", "blocks": [{"type": "ul", "items": ["Entlassung (Kündigung durch AG)", "Vorzeitiger Austritt (Kündigung durch AN)", "Einvernehmliche Auflösung", "Auflösung während der Probezeit", "Entlassung , Fristlose (außerordentliche) Kündigung aus wichtigem Grund (z.B. Diebstahl)"]}]}, {"num": 22, "question": "Was ist der Unterschied zwischen Entlassung und vorzeitigem Austritt?", "answer": "• Beides sind ordentliche Kündigungen.\n• Entlassung: Initiative vom Arbeitgeber.\n• Vorzeitiger Austritt: Initiative vom Arbeitnehmer.", "blocks": [{"type": "ul", "items": ["Beides sind ordentliche Kündigungen.", "Entlassung: Initiative vom Arbeitgeber.", "Vorzeitiger Austritt: Initiative vom Arbeitnehmer."]}]}, {"num": 23, "question": "Wie sind die Kündigungsfristen geregelt? (Angestelltengesetz)", "answer": "• Steigend mit Betriebszugehörigkeit:\nBis 2. Jahr: 6 Wochen\n3. – 5. Jahr: 2 Monate\n6. – 15. Jahr: 3 Monate\n16. – 25. Jahr: 4 Monate\nAb 26. Jahr: 5 Monate\n• Der Kollektivvertrag kann günstigere Fristen vorsehen!", "blocks": [{"type": "ul", "items": ["Steigend mit Betriebszugehörigkeit: Bis 2. Jahr: 6 Wochen 3. – 5. Jahr: 2 Monate 6. – 15. Jahr: 3 Monate 16. – 25. Jahr: 4 Monate Ab 26. Jahr: 5 Monate", "Der Kollektivvertrag kann günstigere Fristen vorsehen!"]}]}, {"num": 24, "question": "Zu welchen Terminen darf gekündigt werden? (Kündigungstermin)", "answer": "• Zum letzten Tag eines Kalendermonats. Oft (laut KV) auch zum 15. eines\nMonats.", "blocks": [{"type": "ul", "items": ["Zum letzten Tag eines Kalendermonats. Oft (laut KV) auch zum 15. eines Monats."]}]}, {"num": 25, "question": "Was ist Kündigungsschutz? Wem darf man nicht kündigen?", "answer": "• Schutz bestimmter Personengruppen vor ordentlicher Kündigung, z.B.:\no Schwangere und Karenzurlauber\no Arbeitnehmer im Präsenz-/Zivildienst\no Betriebsratsmitglieder (mit erschwertem Kündigungsschutz)", "blocks": [{"type": "ul", "items": ["Schutz bestimmter Personengruppen vor ordentlicher Kündigung, z.B.: o Schwangere und Karenzurlauber o Arbeitnehmer im Präsenz-/Zivildienst o Betriebsratsmitglieder (mit erschwertem Kündigungsschutz)"]}]}, {"num": 26, "question": "Kann man während der Probezeit/Urlaubs/befristet/im Krankenstand/bei Arbeitsunfall kündigen?", "answer": "Probezeit: Ja, jederzeit möglich\n• Ohne Frist und ohne Angabe von Gründen\n• Von Arbeitnehmer und Arbeitgeber\n• Max. 1 Monat Probezeit\nUrlaub: Ja\n• Eine Kündigung während des Urlaubs ist zulässig\n• Der Urlaub wird nicht unterbrochen\n• Offene Urlaubstage sind abzugelten\n• Befristet:\nEnde automatisch mit Vertragsende. Außerordentliche Kündigung aus\nwichtigem Grund möglich.\nKrankenstand: Ja\n• Kündigung ist rechtlich zulässig\n• Aber: Kündigung wegen der Krankheit kann sittenwidrig sein\n• Entgeltfortzahlung läuft trotz Kündigung bis zum gesetzlichen Ende\n• Arbeitsunfall:\nBesonders streng. Eine Kündigung wegen des Unfalls ist in der Regel\nunwirksam.", "blocks": [{"type": "ul", "items": ["Probezeit: Ja, jederzeit möglich", "Ohne Frist und ohne Angabe von Gründen", "Von Arbeitnehmer und Arbeitgeber", "Max. 1 Monat Probezeit Urlaub: Ja", "Eine Kündigung während des Urlaubs ist zulässig", "Der Urlaub wird nicht unterbrochen", "Offene Urlaubstage sind abzugelten", "Befristet: Ende automatisch mit Vertragsende. Außerordentliche Kündigung aus wichtigem Grund möglich. Krankenstand: Ja", "Kündigung ist rechtlich zulässig", "Aber: Kündigung wegen der Krankheit kann sittenwidrig sein", "Entgeltfortzahlung läuft trotz Kündigung bis zum gesetzlichen Ende", "Arbeitsunfall: Besonders streng. Eine Kündigung wegen des Unfalls ist in der Regel unwirksam."]}]}, {"num": 27, "question": "Wie hoch ist der Urlaubsanspruch in Österreich? Wann entsteht er?", "answer": "• 30 Werktage (bei 6-Tage-Woche) bzw. 25 Werktage (bei 5-Tage-Woche).\n• Der volle Anspruch entsteht mit jedem Arbeitsjahr und wird im\ndarauffolgenden Kalenderjahr konsumiert.", "blocks": [{"type": "ul", "items": ["30 Werktage (bei 6-Tage-Woche) bzw. 25 Werktage (bei 5-Tage-Woche).", "Der volle Anspruch entsteht mit jedem Arbeitsjahr und wird im darauffolgenden Kalenderjahr konsumiert."]}]}, {"num": 28, "question": "Was ist die Probezeit?", "answer": "• Während der Probezeit kann das Arbeitsverhältnis jederzeit vom Arbeitnehmer\noder Arbeitgeber ohne Angabe von Gründen und ohne Kündigungsfrist aufgelöst\nwerden. Die Probezeit dauert in der Regel einen Monat.", "blocks": [{"type": "ul", "items": ["Während der Probezeit kann das Arbeitsverhältnis jederzeit vom Arbeitnehmer oder Arbeitgeber ohne Angabe von Gründen und ohne Kündigungsfrist aufgelöst werden. Die Probezeit dauert in der Regel einen Monat."]}]}, {"num": 29, "question": "Welche Pausenregelungen gelten für Taxilenker? Unterschied Lenkpause / Ruhepause?", "answer": "1. Lenkpause: Pro Tag: Maximal 9 Stunden (2x in der Woche darf die Lenkzeit\nauf 10\nStunden verlängert werden)\n• Pro Woche: Maximal 56 Stunden\n2. Ruhepause:\nDie tägliche Ruhezeit muss mindestens 11 Stunden betragen .\n• Können nicht kombiniert werden.", "blocks": [{"type": "ul", "items": ["1. Lenkpause: Pro Tag: Maximal 9 Stunden (2x in der Woche darf die Lenkzeit auf 10 Stunden verlängert werden)", "Pro Woche: Maximal 56 Stunden 2. Ruhepause: Die tägliche Ruhezeit muss mindestens 11 Stunden betragen .", "Können nicht kombiniert werden."]}]}, {"num": 30, "question": "Tägliche und wöchentliche Lenk- und Ruhezeiten?", "answer": "• Tägliche Lenkzeit: Max. 9 Std. (2x/Woche: 10 Std.).\n• Wöchentliche Lenkzeit: Max. 56 Std. (in 2 Wochen: max. 90 Std.).\n• Tägliche Ruhezeit: Min. 11 Std. ununterbrochen (reduzierbar auf 9 Std., muss\nausgeglichen werden).\n• Wöchentliche Ruhezeit: Min. 1x 45 Std. oder 24 Std. + 21 Std.", "blocks": [{"type": "ul", "items": ["Tägliche Lenkzeit: Max. 9 Std. (2x/Woche: 10 Std.).", "Wöchentliche Lenkzeit: Max. 56 Std. (in 2 Wochen: max. 90 Std.).", "Tägliche Ruhezeit: Min. 11 Std. ununterbrochen (reduzierbar auf 9 Std., muss ausgeglichen werden).", "Wöchentliche Ruhezeit: Min. 1x 45 Std. oder 24 Std. + 21 Std."]}]}, {"num": 31, "question": "Entgeltfortzahlung bei Dienstverhinderung (Krankheit, Arbeitsunfall, Behördenweg)?", "answer": "• Krankheit: AG zahlt für KV-Dauer (z.B. 6-12 Wo.), danach Krankengeld.\n• Arbeitsunfall: 8 Wochen volle Entgeltfortzahlung durch AG (ASVG). AUVA\nfür Heilbehandlung.\n• Behördenweg/ wichtige Gründe: AG muss freigeben, muss nicht bezahlen.", "blocks": [{"type": "ul", "items": ["Krankheit: AG zahlt für KV-Dauer (z.B. 6-12 Wo.), danach Krankengeld.", "Arbeitsunfall: 8 Wochen volle Entgeltfortzahlung durch AG (ASVG). AUVA für Heilbehandlung.", "Behördenweg/ wichtige Gründe: AG muss freigeben, muss nicht bezahlen."]}]}, {"num": 32, "question": "Wie lange und in welcher Höhe wird bei Krankenstand/Arbeitsunfall bezahlt?", "answer": "• Krankenstand: Dauer laut KV. Höhe: 100% des regelmäßigen Entgelts.\n• Arbeitsunfall: 8 Wochen, 100% des regelmäßigen Entgelts.", "blocks": [{"type": "ul", "items": ["Krankenstand: Dauer laut KV. Höhe: 100% des regelmäßigen Entgelts.", "Arbeitsunfall: 8 Wochen, 100% des regelmäßigen Entgelts."]}]}, {"num": 33, "question": "Welche Sonderzahlungen gibt es? (Urlaubs-/Weihnachtsgeld)", "answer": "• Urlaubsgeld: Fällig mit Mai/Juni, oft 1 Monatsgehalt.\n• Weihnachtsremuneration: Fällig im November, oft 1 Monatsgehalt.\n• Höhe und Fälligkeit sind im Kollektivvertrag geregelt.", "blocks": [{"type": "ul", "items": ["Urlaubsgeld: Fällig mit Mai/Juni, oft 1 Monatsgehalt.", "Weihnachtsremuneration: Fällig im November, oft 1 Monatsgehalt.", "Höhe und Fälligkeit sind im Kollektivvertrag geregelt."]}]}, {"num": 34, "question": "Was sind die Pflichten des Dienstgebers aus dem Dienstverhältnis?", "answer": "• Anmeldepflicht: Der Arbeitgeber muss den Arbeitnehmer bei der\nSozialversicherung anmelden.\n• Fürsorgepflicht: Der Arbeitgeber ist verpflichtet, für das Wohl und die\nSicherheit des Arbeitnehmers zu sorgen.\n• Entgeltzahlungspflicht: Der Arbeitgeber muss das vereinbarte Gehalt\npünktlichzahlen.\n• Entgeltfortzahlungspflicht : Der Arbeitgeber muss dem Arbeitnehmer den\ngesetzlich vorgeschriebenen Urlaub gewähren .", "blocks": [{"type": "ul", "items": ["Anmeldepflicht: Der Arbeitgeber muss den Arbeitnehmer bei der Sozialversicherung anmelden.", "Fürsorgepflicht: Der Arbeitgeber ist verpflichtet, für das Wohl und die Sicherheit des Arbeitnehmers zu sorgen.", "Entgeltzahlungspflicht: Der Arbeitgeber muss das vereinbarte Gehalt pünktlichzahlen.", "Entgeltfortzahlungspflicht : Der Arbeitgeber muss dem Arbeitnehmer den gesetzlich vorgeschriebenen Urlaub gewähren ."]}]}]}, {"title": "Steuer- und Rechnungslegung (Buchhaltung)", "questions": [{"num": 35, "question": "Was ist die Umsatzsteuer (UST)? Welche Sätze gibt es?", "answer": "Die Umsatzsteuer (USt) ist eine allgemeine Verbrauchssteuer in Österreich.\nSie wird auf Lieferungen und sonstige Leistungen erhoben, die ein Unternehmer gegen\nEntgelt im Inland ausführt.\n➡ Unternehmer heben die USt ein und führen sie an das Finanzamt ab.\n➡ Endverbraucher tragen die Steuer wirtschaftlich.\nWelche Umsatzsteuersätze gibt es in Österreich?\n1- Normalsteuersatz: 20 %\nGilt für die meisten Waren und Dienstleistungen, z. B.:\n• Kleidung\n• Elektronik\n• Dienstleistungen\n• Handwerksleistungen\n2- Ermäßigter Steuersatz: 10 %\nGilt u. a. für:\n• Lebensmittel\n• Bücher, Zeitungen\n• Medikamente\n• Miete für Wohnzwecke\n• Personenbeförderung (z. B. Taxi)\n3- Ermäßigter Steuersatz: 13 %\nGilt u. a. für:\n• Nächtigungen (Hotel, Pension)\n• Kunst, Kultur (z. B. Theater, Museen)\n• Eintrittsgelder zu Veranstaltungen\n• Tierfutter, Pflanzen\n4- 0 % (steuerfrei mit Vorsteuerabzug)\nGilt z. B. für:\n• Ausfuhrlieferungen\n• innergemeinschaftliche Lieferungen\n• bestimmte internationale Transporte\n⚠ Sonderregel: Kleinunternehmerregelung\n• Umsatz bis € 35.000 pro Jahr\n• Keine USt auf Rechnungen\n• Kein Vorsteuerabzug\n• Anwendung freiwillig (Verzicht möglich)", "blocks": [{"type": "ul", "items": ["Die Umsatzsteuer (USt) ist eine allgemeine Verbrauchssteuer in Österreich. Sie wird auf Lieferungen und sonstige Leistungen erhoben, die ein Unternehmer gegen Entgelt im Inland ausführt. ➡ Unternehmer heben die USt ein und führen sie an das Finanzamt ab. ➡ Endverbraucher tragen die Steuer wirtschaftlich. Welche Umsatzsteuersätze gibt es in Österreich? 1- Normalsteuersatz: 20 % Gilt für die meisten Waren und Dienstleistungen, z. B.:", "Kleidung", "Elektronik", "Dienstleistungen", "Handwerksleistungen 2- Ermäßigter Steuersatz: 10 % Gilt u. a. für:", "Lebensmittel", "Bücher, Zeitungen", "Medikamente", "Miete für Wohnzwecke", "Personenbeförderung (z. B. Taxi) 3- Ermäßigter Steuersatz: 13 % Gilt u. a. für:", "Nächtigungen (Hotel, Pension)", "Kunst, Kultur (z. B. Theater, Museen)", "Eintrittsgelder zu Veranstaltungen", "Tierfutter, Pflanzen 4- 0 % (steuerfrei mit Vorsteuerabzug) Gilt z. B. für:", "Ausfuhrlieferungen", "innergemeinschaftliche Lieferungen", "bestimmte internationale Transporte ⚠ Sonderregel: Kleinunternehmerregelung", "Umsatz bis € 35.000 pro Jahr", "Keine USt auf Rechnungen", "Kein Vorsteuerabzug", "Anwendung freiwillig (Verzicht möglich)"]}]}, {"num": 36, "question": "Wann muss die Umsatzsteuer bezahlt werden? (Zahllast, Frist)", "answer": "• Die Umsatzsteuervoranmeldung mit Zahllast ist bis zum 15. des zweiten auf\nden Abrechnungsmonat folgenden Kalendermonats fällig.\n• Beispiel für Januar: Fälligkeit 15. März.", "blocks": [{"type": "ul", "items": ["Die Umsatzsteuervoranmeldung mit Zahllast ist bis zum 15. des zweiten auf den Abrechnungsmonat folgenden Kalendermonats fällig.", "Beispiel für Januar: Fälligkeit 15. März."]}]}, {"num": 37, "question": "Was ist die Vorsteuer?", "answer": "• Die UST, die ein Unternehmer selbst auf seine betrieblichen Einkäufe zahlt (z.B.\nBenzin, Reparatur). Sie kann mit der vereinnahmten UST verrechnet werden.", "blocks": [{"type": "ul", "items": ["Die UST, die ein Unternehmer selbst auf seine betrieblichen Einkäufe zahlt (z.B. Benzin, Reparatur). Sie kann mit der vereinnahmten UST verrechnet werden."]}]}, {"num": 38, "question": "Welche 7 Einkunftsarten gibt es?", "answer": "1. Land- und Forstwirtschaft\n2. Selbständige Arbeit (Freiberufler)\n3. Gewerbebetrieb (Taxi)\n4. Nicht-selbständige Arbeit (Angestellte)\n5. Kapitalvermögen\n6. Vermietung und Verpachtung\n7. Sonstige Einkünfte", "blocks": [{"type": "p_list", "paras": ["1. Land- und Forstwirtschaft 2. Selbständige Arbeit (Freiberufler) 3. Gewerbebetrieb (Taxi) 4. Nicht-selbständige Arbeit (Angestellte) 5. Kapitalvermögen 6. Vermietung und Verpachtung 7. Sonstige Einkünfte"]}]}, {"num": 39, "question": "Was ist eine Bilanz? Wie ist sie aufgebaut? (Aktiva/Passiva)", "answer": "• Gegenüberstellung von Vermögen und Kapital zu einem Stichtag.\n• Aktiva (Vermögenswerte): Anlagevermögen (Fahrzeuge) & Umlaufvermögen\n(Bank, Forderungen).\n• Passiva (Kapitalherkunft): Eigenkapital (Stammkapital, Gewinn) &\nFremdkapital (Kredite, Verbindlichkeiten).", "blocks": [{"type": "ul", "items": ["Gegenüberstellung von Vermögen und Kapital zu einem Stichtag.", "Aktiva (Vermögenswerte): Anlagevermögen (Fahrzeuge) & Umlaufvermögen (Bank, Forderungen).", "Passiva (Kapitalherkunft): Eigenkapital (Stammkapital, Gewinn) & Fremdkapital (Kredite, Verbindlichkeiten)."]}]}, {"num": 40, "question": "Was ist die Gewinn- und Verlustrechnung (GuV)?", "answer": "• Zeigt die Ertrags- und Aufwandssituation einer Periode.\n• Formel: Erträge - Aufwendungen = Gewinn/Verlust (geht dann in die\nBilanz).", "blocks": [{"type": "ul", "items": ["Zeigt die Ertrags- und Aufwandssituation einer Periode.", "Formel: Erträge - Aufwendungen = Gewinn/Verlust (geht dann in die Bilanz)."]}]}, {"num": 41, "question": "Wer muss eine doppelte Buchführung (Doppik) machen? (Buchführungsgrenzen)", "answer": "• Kapitalgesellschaften (GmbH, AG) immer.\n• Einzelunternehmen/Personengesellschaften bei Überschreiten von 2 von 3\nGrenzen:\no Umsatz > € 700.000\no Gewinn > € 100.000\no Bilanzsumme > € 350.000", "blocks": [{"type": "ul", "items": ["Kapitalgesellschaften (GmbH, AG) immer.", "Einzelunternehmen/Personengesellschaften bei Überschreiten von 2 von 3 Grenzen: o Umsatz > € 700.000 o Gewinn > € 100.000 o Bilanzsumme > € 350.000"]}]}, {"num": 42, "question": "Was ist Afa (Absetzung für Abnutzung)?", "answer": "• Steuerliche Abschreibung von Anlagegütern über deren\nNutzungsdauer. *Beispiel: Auto Netto (€50.000 / 5 Jahre = €10.000 Afa/Jahr).*", "blocks": [{"type": "ul", "items": ["Steuerliche Abschreibung von Anlagegütern über deren Nutzungsdauer. *Beispiel: Auto Netto (€50.000 / 5 Jahre = €10.000 Afa/Jahr).*"]}]}, {"num": 43, "question": "Was sind geringwertige Wirtschaftsgüter (GWG)?", "answer": "• Anschaffungen bis € 1.000 netto (zzgl. USt). Können im Jahr der\nAnschaffung sofort voll abgesetzt werden (statt über Afa). Beispiel: Computer\n€800.", "blocks": [{"type": "ul", "items": ["Anschaffungen bis € 1.000 netto (zzgl. USt). Können im Jahr der Anschaffung sofort voll abgesetzt werden (statt über Afa). Beispiel: Computer €800."]}]}, {"num": 44, "question": "Was ist der Deckungsbeitrag? Formel und Bedeutung?", "answer": "• Deckungsbeitrag = Umsatzerlöse - variable Kosten.\n• Zeigt, wie viel zur Deckung der Fixkosten und für den Gewinn übrig bleibt.\nNegativ = Leistung trägt nicht mal variable Kosten.", "blocks": [{"type": "ul", "items": ["Deckungsbeitrag = Umsatzerlöse - variable Kosten.", "Zeigt, wie viel zur Deckung der Fixkosten und für den Gewinn übrig bleibt. Negativ = Leistung trägt nicht mal variable Kosten."]}]}, {"num": 45, "question": "Was sind variable Kosten, fixe Kosten, Einzel- und Gemeinkosten?", "answer": "• Variable Kosten: Ändern sich mit Leistungsmenge (Benzin).\n• Fixe Kosten: Bleiben gleich (Standplatzmiete, Versicherung).\n• Einzelkosten: Direkt zurechenbar (im Taxigewerbe kaum vorhanden).\nEinzelkosten = Kosten, die direkt und eindeutig einem Taxi, Fahrer oder einer\nFahrt zugeordnet werden können.\n• Gemeinkosten: Für gesamten Betrieb, nicht direkt zurechenbar (Handyvertrag,\nSteuerberater).", "blocks": [{"type": "ul", "items": ["Variable Kosten: Ändern sich mit Leistungsmenge (Benzin).", "Fixe Kosten: Bleiben gleich (Standplatzmiete, Versicherung).", "Einzelkosten: Direkt zurechenbar (im Taxigewerbe kaum vorhanden). Einzelkosten = Kosten, die direkt und eindeutig einem Taxi, Fahrer oder einer Fahrt zugeordnet werden können.", "Gemeinkosten: Für gesamten Betrieb, nicht direkt zurechenbar (Handyvertrag, Steuerberater)."]}]}, {"num": 46, "question": "Was sind kalkulatorische Kosten? Beispiele?", "answer": "• Kosten in der Kostenrechnung, die nicht zahlungswirksam sind. Dienen\ngenauerer Kostenermittlung.\n• Beispiele: Kalkulatorischer Unternehmerlohn (für eigene Arbeit),\nkalkulatorische Zinsen (für Eigenkapital).", "blocks": [{"type": "ul", "items": ["Kosten in der Kostenrechnung, die nicht zahlungswirksam sind. Dienen genauerer Kostenermittlung.", "Beispiele: Kalkulatorischer Unternehmerlohn (für eigene Arbeit), kalkulatorische Zinsen (für Eigenkapital)."]}]}, {"num": 47, "question": "Was ist die Vorkalkulation und Nachkalkulation? (Ist-/Soll-Kosten)", "answer": "• Vorkalkulation: Planung vor einer Leistung (Soll-Kosten). Dient der\nPreisfindung.\n• Nachkalkulation: Kontrolle nach der Leistung (Ist-Kosten). Dient dem\nVergleich mit der Vorkalkulation und der Wirtschaftlichkeitskontrolle.", "blocks": [{"type": "ul", "items": ["Vorkalkulation: Planung vor einer Leistung (Soll-Kosten). Dient der Preisfindung.", "Nachkalkulation: Kontrolle nach der Leistung (Ist-Kosten). Dient dem Vergleich mit der Vorkalkulation und der Wirtschaftlichkeitskontrolle."]}]}, {"num": 48, "question": "Was ist der Break-even-Point (Gewinnschwelle)?", "answer": "• Der Punkt, an dem Gesamterlös = Gesamtkosten ist. Ab diesem Punkt macht\ndas Unternehmen Gewinn. Berechnet mit: Fixkosten / Deckungsbeitrag pro\nStück.", "blocks": [{"type": "ul", "items": ["Der Punkt, an dem Gesamterlös = Gesamtkosten ist. Ab diesem Punkt macht das Unternehmen Gewinn. Berechnet mit: Fixkosten / Deckungsbeitrag pro Stück."]}]}, {"num": 49, "question": "Was sind Kostenträger? Beispiele?", "answer": "• Die Produkte oder Dienstleistungen, denen Kosten zugerechnet werden.\n• Beispiele im Taxi: Eine einzelne Fahrt, ein Stundentarif, ein Botenfahrt .", "blocks": [{"type": "ul", "items": ["Die Produkte oder Dienstleistungen, denen Kosten zugerechnet werden.", "Beispiele im Taxi: Eine einzelne Fahrt, ein Stundentarif, ein Botenfahrt ."]}]}, {"num": 50, "question": "Was ist eine Saldenliste / Soll-Haben-Liste?", "answer": "• Eine Auflistung aller Konten der Buchhaltung mit ihrem Endsaldo (Soll- oder\nHabenseite) zu einem Stichtag. Ist die Grundlage für die Erstellung der Bilanz\nund GuV.", "blocks": [{"type": "ul", "items": ["Eine Auflistung aller Konten der Buchhaltung mit ihrem Endsaldo (Soll- oder Habenseite) zu einem Stichtag. Ist die Grundlage für die Erstellung der Bilanz und GuV."]}]}, {"num": 51, "question": "Wie ermittelt man den Gewinn aus der Bilanz?", "answer": "• Erträge − Aufwendungen = Gewinn/Verlust der Periode.\n• In der Praxis wird der Gewinn über die GuV-Rechnung ermittelt.", "blocks": [{"type": "ul", "items": ["Erträge − Aufwendungen = Gewinn/Verlust der Periode.", "In der Praxis wird der Gewinn über die GuV-Rechnung ermittelt."]}]}, {"num": 52, "question": "Was ist der Verschuldungsgrad?", "answer": "• Kennzahl: Fremdkapital / Eigenkapital. Zeigt, wie stark ein Unternehmen\nfremdfinanziert ist. Ein hoher Grad bedeutet höheres finanzielles Risiko.", "blocks": [{"type": "ul", "items": ["Kennzahl: Fremdkapital / Eigenkapital. Zeigt, wie stark ein Unternehmen fremdfinanziert ist. Ein hoher Grad bedeutet höheres finanzielles Risiko."]}]}, {"num": 53, "question": "Wann ist die Kommunalsteuer fällig?", "answer": "• Die Kommunalsteuer (auf die Lohnsumme)\nist monatlich bzw. vierteljährlich an die Gemeinde abzuführen (Frist: 15. des\nFolgemonats).", "blocks": [{"type": "ul", "items": ["Die Kommunalsteuer (auf die Lohnsumme) ist monatlich bzw. vierteljährlich an die Gemeinde abzuführen (Frist: 15. des Folgemonats)."]}]}, {"num": 54, "question": "Was ist der Unterschied zwischen Rücklage und Rückstellung?", "answer": "• Rücklage: Teil des Eigenkapitals. Wird aus einbehaltenen Gewinnen gebildet,\nfür künftige Investitionen oder Verluste.\n• Rückstellung: Eine Verbindlichkeit (Fremdkapital) für ungewisse, aber\nwahrscheinliche künftige Ausgaben (z.B. Prozesskosten, Garantieleistungen).", "blocks": [{"type": "ul", "items": ["Rücklage: Teil des Eigenkapitals. Wird aus einbehaltenen Gewinnen gebildet, für künftige Investitionen oder Verluste.", "Rückstellung: Eine Verbindlichkeit (Fremdkapital) für ungewisse, aber wahrscheinliche künftige Ausgaben (z.B. Prozesskosten, Garantieleistungen)."]}]}, {"num": 55, "question": "Wann ist volle und halbe Afa? (Im Anschaffungsjahr)", "answer": "Halbe Afa: Wenn das Wirtschaftsgut im 2. Halbjahr angeschafft bzw. in Betrieb\ngenommen wird:\n• Anschaffung und Inbetriebnahme : 1. Juli bis 31. Dezember\nVolle Afa: Wenn das Wirtschaftsgut im 1. Halbjahr angeschafft bzw. in Betrieb\ngenommen wird:\n• Anschaffung und Inbetriebnahme : 1. Jänner bis 30. Juni", "blocks": [{"type": "ul", "items": ["Halbe Afa: Wenn das Wirtschaftsgut im 2. Halbjahr angeschafft bzw. in Betrieb genommen wird:", "Anschaffung und Inbetriebnahme : 1. Juli bis 31. Dezember Volle Afa: Wenn das Wirtschaftsgut im 1. Halbjahr angeschafft bzw. in Betrieb genommen wird:", "Anschaffung und Inbetriebnahme : 1. Jänner bis 30. Juni"]}]}, {"num": 56, "question": "Was sind Zusatzkosten? (im kaufmännischen Sinn)", "answer": "• Ein unspezifischer Begriff. Gemeint sein könnten Gemeinkosten\n(Fixkosten) oder speziell Vertriebs- und Verwaltungskosten. Besser die\npräzisen Begriffe variable und fixe Kostenverwenden.", "blocks": [{"type": "ul", "items": ["Ein unspezifischer Begriff. Gemeint sein könnten Gemeinkosten (Fixkosten) oder speziell Vertriebs- und Verwaltungskosten. Besser die präzisen Begriffe variable und fixe Kostenverwenden."]}]}]}, {"title": "Fachrecht Taxi (Betriebsordnung, Konzession, Ausstattung)", "questions": [{"num": 57, "question": "Wo findet man die arbeitsrechtlichen Regelungen für die Taxibranche?", "answer": "• Im Kollektivvertrag für das Taxigewerbe und im Angestelltengesetz.", "blocks": [{"type": "ul", "items": ["Im Kollektivvertrag für das Taxigewerbe und im Angestelltengesetz."]}]}, {"num": 58, "question": "Was ist die Bundesbetriebsordnung und was die Landesbetriebsordnung? Unterschied?", "answer": "• BBO: Bundesgesetz mit grundlegenden Regeln für den gewerblichen\nPersonenverkehr in ganz Österreich.\n• LBO: Landesgesetz, das die BBO ergänzt und konkretisiert (z.B. lokale\nAusstattung, Taxitarife).\n• Unterschied: BBO gilt bundesweit einheitlich, LBO ist je Bundesland\nverschieden.", "blocks": [{"type": "ul", "items": ["BBO: Bundesgesetz mit grundlegenden Regeln für den gewerblichen Personenverkehr in ganz Österreich.", "LBO: Landesgesetz, das die BBO ergänzt und konkretisiert (z.B. lokale Ausstattung, Taxitarife).", "Unterschied: BBO gilt bundesweit einheitlich, LBO ist je Bundesland verschieden."]}]}, {"num": 59, "question": "Was steht alles auf einem Taxischein (Lenkerausweis)?", "answer": "• Name und Lichtbild des Lenkers.\n• Befristung (Gültigkeit: max. 5 Jahre).\n• Ausstellungsbehörde und -datum.\n• Nachweisbereich für Ortskenntnisse und Kenntnisse der Landesbetriebsordnung,\nTarife und kollektivvertragliche Bestimmungen.", "blocks": [{"type": "ul", "items": ["Name und Lichtbild des Lenkers.", "Befristung (Gültigkeit: max. 5 Jahre).", "Ausstellungsbehörde und -datum.", "Nachweisbereich für Ortskenntnisse und Kenntnisse der Landesbetriebsordnung, Tarife und kollektivvertragliche Bestimmungen."]}]}, {"num": 60, "question": "Was braucht man für die Anmeldung einer Konzession (Schritte)?", "answer": "1. Bestandene Konzessionsprüfung oder Gewerbliche Geschäftsführer.\n2. Nachweis persönlicher Zuverlässigkeit (Strafregisterauszug).\n3. Nachweis finanzieller Leistungsfähigkeit ,€ 18.500,- pro Konzession ,oder\n7.500,- und ein Kaufvertrag.\n4. Geeignetes und ausgerüstetes Fahrzeug . ab dem 1. Jänner 2025 erstmalig als\nTaxi zugelassen werden, müssen einen rein elektrischen Antrieb (Akku oder\nWasserstoff ) haben. Bereits zugelassene Taxis mit Verbrennungsmotor dürfen weiter\nbetrieben werden.\n5. Antrag bei zuständiger Behörde (z.B. MA 63 Wien).\n6. Unternehmerzeugnis der WKO.\n7. Abstellplatz ( ein park Garage pro Auto ) in Wien oder Wien umgebung.", "blocks": [{"type": "p_list", "paras": ["1. Bestandene Konzessionsprüfung oder Gewerbliche Geschäftsführer. 2. Nachweis persönlicher Zuverlässigkeit (Strafregisterauszug). 3. Nachweis finanzieller Leistungsfähigkeit ,€ 18.500,- pro Konzession ,oder 7.500,- und ein Kaufvertrag. 4. Geeignetes und ausgerüstetes Fahrzeug . ab dem 1. Jänner 2025 erstmalig als Taxi zugelassen werden, müssen einen rein elektrischen Antrieb (Akku oder Wasserstoff ) haben. Bereits zugelassene Taxis mit Verbrennungsmotor dürfen weiter betrieben werden. 5. Antrag bei zuständiger Behörde (z.B. MA 63 Wien). 6. Unternehmerzeugnis der WKO. 7. Abstellplatz ( ein park Garage pro Auto ) in Wien oder Wien umgebung."]}]}, {"num": 61, "question": "Wie soll ein Taxifahrzeug beschaffen sein? (Mindestmaße, Ausstattung)", "answer": "Mindestmaße: Ein Taxi-KFZ muss eine Mindestlänge von 4,2 Metern (420 cm) , oder 4200\nmm aufweisen Breite 1.56 cm , Euro Norm 6 , 4 Türen .\nMindestausstattung (Wiener LBO): beleuchtetes Dachschild, Taxameter,\nInnenbeleuchtung, die Wiener Landesbetriebsordnung\n• Ein Auszug aus dem Gewerberegister ( GISA )\n• den Taxitarif\n• Info Blatt und QR Code\n• Erste-Hilfe-Kasten, Warnweste.\nGeräte :\n• Bankomatgerät\n• Navigation\n• Registrierkasse", "blocks": [{"type": "ul", "items": ["Mindestmaße: s Tarifgebiets durchzuführen.\n• Ausschließungsgründe (in der Person des Fahrgastes):\no Offensichtliche Krankheitsgefahr.\no Trunkenheit/Betäubung.\no Unsauberkeit (Belästigung).\no Gefährliche Gegenstände.\no Beförderung außerhalb des Tarifgebiets (dann freie Vereinbarung).\no Blinde mit Hund, Rollstuhlfahrer etc. dürfen NICHT ausgeschlossen\nwerden.", "blocks": [{"type": "p_list", "paras": ["o Offensichtliche Krankheitsgefahr. o Trunkenheit/Betäubung. o Unsauberkeit (Belästigung). o Gefährliche Gegenstände. o Beförderung außerhalb des Tarifgebiets (dann freie Vereinbarung). o Blinde mit Hund, Rollstuhlfahrer etc. dürfen NICHT ausgeschlossen werden."]}, {"type": "ul", "items": ["Pflicht, jede Beförderung innerhalb des Tarifgebiets durchzuführen.", "Ausschließungsgründe (in der Person des Fahrgastes):"]}]}, {"num": 65, "question": "Welche Taxitarife gibt es? Tagtarif (werktags von 6 - 23 Uhr)", "answer": "Nachttarif (werktags von 23 - 6 Uhr), Sonn- und Feiertagstarif (von 0 - 24 Uhr):\n• Tarif im Ortsgebiet (Wiener Tarif): Verbindlicher tarif.\n• Außerhalb des Ortsgebiets: Freie Vereinbarung vor Fahrtantritt. Ohne\nVereinbarung gilt der verbindliche Streckentarif.", "blocks": [{"type": "ul", "items": ["Nachttarif (werktags von 23 - 6 Uhr), Sonn- und Feiertagstarif (von 0 - 24 Uhr):", "Tarif im Ortsgebiet (Wiener Tarif): Verbindlicher tarif.", "Außerhalb des Ortsgebiets: Freie Vereinbarung vor Fahrtantritt. Ohne Vereinbarung gilt der verbindliche Streckentarif."]}]}, {"num": 66, "question": "Woraus setzt sich der Wiener Taxitarif zusammen? (Komponenten)", "answer": "1. Grundtaxe (Bereitstellung).\n2. Streckentaxe (pro km).\n3. Zeittaxe (pro Minute/Stunde Wartezeit).\n4. Zuschläge > 4 Personen € 2,-\nFür die Bestellung über Standplatztelefon ist ein Zuschlag 2 Euro zu verrechnen.", "blocks": [{"type": "p_list", "paras": ["1. Grundtaxe (Bereitstellung). 2. Streckentaxe (pro km). 3. Zeittaxe (pro Minute/Stunde Wartezeit). 4. Zuschläge > 4 Personen € 2,- Für die Bestellung über Standplatztelefon ist ein Zuschlag 2 Euro zu verrechnen."]}]}, {"num": 67, "question": "Was kostet eine Stunde Wartezeit (Tag/Nacht)? (Beispiel)", "answer": "• Prinzip wichtig, Werte ändern sich.\n• Tag: Zeittaxe/Min. z.B. € 0.58 → Stunde ≈ €34.80.\n• Nacht/Sonn-/Feiertag: € 0.67→ Stunde ≈ €40.20.", "blocks": [{"type": "ul", "items": ["Prinzip wichtig, Werte ändern sich.", "Tag: Zeittaxe/Min. z.B. € 0.58 → Stunde ≈ €34.80.", "Nacht/Sonn-/Feiertag: € 0.67→ Stunde ≈ €40.20."]}]}, {"num": 68, "question": "Was ist ein verbindlicher Tarif? Ist der Wiener Tarif verbindlich?", "answer": "• Ein vom Landeshauptmann festgesetzter, zwingend anzuwendender Tarif.\n• Ja, der Wiener Tarif ist ein verbindlicher Tarif.", "blocks": [{"type": "ul", "items": ["Ein vom Landeshauptmann festgesetzter, zwingend anzuwendender Tarif.", "Ja, der Wiener Tarif ist ein verbindlicher Tarif."]}]}, {"num": 69, "question": "Wer stellt den Antrag für den Taxitarif? Wer verordnet ihn?", "answer": "• Antrag: Die Interessenvertretungen (Fachgruppe der WKO und\nGewerkschaft).\n• Verordnung: Der Landeshauptmann (in Wien: der Bürgermeister).", "blocks": [{"type": "ul", "items": ["Antrag: Die Interessenvertretungen (Fachgruppe der WKO und Gewerkschaft).", "Verordnung: Der Landeshauptmann (in Wien: der Bürgermeister)."]}]}, {"num": 70, "question": "Was steht auf einer Taxirechnung?", "answer": "• Name/Adresse des Unternehmers, Datum, Rechnungsnummer, Start-/Zielort,\ngefahrene km, Gesamtbetrag, Umsatzsteuersatz (10 %) und -betrag , QR Code.", "blocks": [{"type": "ul", "items": ["Name/Adresse des Unternehmers, Datum, Rechnungsnummer, Start-/Zielort, gefahrene km, Gesamtbetrag, Umsatzsteuersatz (10 %) und -betrag , QR Code."]}]}, {"num": 71, "question": "Was ist das Gelegenheitsverkehrsgesetz (GTG)?", "answer": "• Regelt die grenzüberschreitende Personenbeförderung und bestimmte\nnationale Gelegenheitsverkehre (z.B. Ausflugsfahrten). Regelt NICHT das\nTaxigewerbe. Das fällt unter das Personenbeförderungsgesetz (PBG).", "blocks": [{"type": "ul", "items": ["Regelt die grenzüberschreitende Personenbeförderung und bestimmte nationale Gelegenheitsverkehre (z.B. Ausflugsfahrten). Regelt NICHT das Taxigewerbe. Das fällt unter das Personenbeförderungsgesetz (PBG)."]}]}, {"num": 72, "question": "Was ist eine Botenfahrt?", "answer": "• Eine Fahrt, bei der kein Fahrgast im Fahrzeug mitfährt, sondern nur\nGegenstände (z.B. Schlüssel, Dokumente) befördert werden. Wird mit\neinem Botenfahrtenzuschlag verrechnet ( freie Vereinbarung ) , oder laut\nTabelle ( Funktabelle )", "blocks": [{"type": "ul", "items": ["Eine Fahrt, bei der kein Fahrgast im Fahrzeug mitfährt, sondern nur Gegenstände (z.B. Schlüssel, Dokumente) befördert werden. Wird mit einem Botenfahrtenzuschlag verrechnet ( freie Vereinbarung ) , oder laut Tabelle ( Funktabelle )"]}]}, {"num": 73, "question": "Was ist ein persönliches Fahrtenbuch?", "answer": "• Ein vom Finanzamt anerkanntes System zur Aufzeichnung betrieblicher und\nprivater Fahrten mit einem Firmenfahrzeug, um den betrieblichen Anteil\nsteuerlich absetzen zu können. Für Taxis (reine Betriebsfahrzeuge)\nnormalerweise nicht relevant.", "blocks": [{"type": "ul", "items": ["Ein vom Finanzamt anerkanntes System zur Aufzeichnung betrieblicher und privater Fahrten mit einem Firmenfahrzeug, um den betrieblichen Anteil steuerlich absetzen zu können. Für Taxis (reine Betriebsfahrzeuge) normalerweise nicht relevant."]}]}, {"num": 74, "question": "Was ist ein Unternehmerschild und was steht drauf?", "answer": "• Muss gut sichtbar am Betriebssitz angebracht sein. Enthält: Firmenname,\nRechtsform, Unternehmensgegenstand (z.B. \"Taxiunternehmer\"),\nFirmensitz ( Adresse ) , Wagennummer W-0000TX .", "blocks": [{"type": "ul", "items": ["Muss gut sichtbar am Betriebssitz angebracht sein. Enthält: Firmenname, Rechtsform, Unternehmensgegenstand (z.B. \"Taxiunternehmer\"), Firmensitz ( Adresse ) , Wagennummer W-0000TX ."]}]}, {"num": 75, "question": "Was muss ich am Ende des Arbeitstages machen?", "answer": "• Nach Dienstende muss der Taxilenker prüfen, ob Gegenstände im Fahrzeug\nzurückgeblieben sind. Sollten der Eigentümer oder die Eigentümerin nicht mehr\nermittelbar sein, müssen diese Gegenstände beim Fundservice der Stadt Wien\n( Siebenbrunnenfeldgasse 3 Wien 1050 ) abgegeben werden.", "blocks": [{"type": "ul", "items": ["Nach Dienstende muss der Taxilenker prüfen, ob Gegenstände im Fahrzeug zurückgeblieben sind. Sollten der Eigentümer oder die Eigentümerin nicht mehr ermittelbar sein, müssen diese Gegenstände beim Fundservice der Stadt Wien ( Siebenbrunnenfeldgasse 3 Wien 1050 ) abgegeben werden."]}]}, {"num": 76, "question": "Was tun, wenn das Taximeter defekt ist?", "answer": "• Der Fahrgast muss sofort auf das Versagen des Fahrpreisanzeigers\naufmerksam gemacht werden.\n• Der Fahrgast darf nicht zum Aussteigen aufgefordert werden.\n• Keine neuen Fahrgäste dürfen aufgenommen werden.\nMöchte der Fahrgast die Fahrt fortsetzen, ist der gesamte Fahrpreis auf\nGrundlage des geltenden Tarifs und der fahrpreisrelevanten Daten zu\nberechnen, wobei die für die Berechnung des Fahrpreises zu verwendenden\nfahrpreisrelevanten Daten aus dem Routenplaner des Bundesministeriums für\nVerkehr zu beziehen sind.", "blocks": [{"type": "ul", "items": ["Der Fahrgast muss sofort auf das Versagen des Fahrpreisanzeigers aufmerksam gemacht werden.", "Der Fahrgast darf nicht zum Aussteigen aufgefordert werden.", "Keine neuen Fahrgäste dürfen aufgenommen werden. Möchte der Fahrgast die Fahrt fortsetzen, ist der gesamte Fahrpreis auf Grundlage des geltenden Tarifs und der fahrpreisrelevanten Daten zu berechnen, wobei die für die Berechnung des Fahrpreises zu verwendenden fahrpreisrelevanten Daten aus dem Routenplaner des Bundesministeriums für Verkehr zu beziehen sind."]}]}, {"num": 77, "question": "Wer kann den Taxilenker kontrollieren? Wer kann die Zulassung/Taxischein abziehen?", "answer": "• Kontrolle: Polizei, Bezirksverwaltungsbehörde (z.B. Magist  Reifen", "Funktionstüchtigkeit des Taxameters", "Überprüfung aller vorgeschriebenen Prüfplaketten", "Mitführen der notwendigen Unterlagen wie Tarifauszug, Betriebsordnung, und europäischer Unfallbericht"]}]}, {"num": 81, "question": "Wie viele Zuschläge haben Wir? (im Taxitarif, alle Arten nennen)", "answer": "• Ein Zuschlag beträgt 2 Euro.\nFür die Bestellung über Standplatztelefon ist ein Zuschlag 2 Euro zu\nverrechnen.\n• Nachtzuschlag, Sonntags- und Feiertagszuschlag, Personenzuschlag (ab der 5.\nPerson) .", "blocks": [{"type": "ul", "items": ["Ein Zuschlag beträgt 2 Euro. Für die Bestellung über Standplatztelefon ist ein Zuschlag 2 Euro zu verrechnen.", "Nachtzuschlag, Sonntags- und Feiertagszuschlag, Personenzuschlag (ab der 5. Person) ."]}]}, {"num": 82, "question": "Wie erkennt man ein Taxi?", "answer": "Am beleuchteten, gelben Dachschild mit der Aufschrift \"TAXI\" und\nder Wagennummer.\n• Mit einem Schild ( mind. 230 x 90 mm ) von innen beleuchtet und gut sichtbar , und mit der\nvon vorne als auch von hinten wahrnehmbarer Aufschrift “ TAXI “. Die Aufschrift “ TAXI “\nhat in gelber Schrift auf schwarzem Untergrund zu erfolgen.", "blocks": [{"type": "ul", "items": ["Am beleuchteten, gelben Dachschild mit der Aufschrift \"TAXI\" und der Wagennummer.", "Mit einem Schild ( mind. 230 x 90 mm ) von innen beleuchtet und gut sichtbar , und mit der von vorne als auch von hinten wahrnehmbarer Aufschrift “ TAXI “. Die Aufschrift “ TAXI “ hat in gelber Schrift auf schwarzem Untergrund zu erfolgen."]}]}, {"num": 83, "question": "Was ist § 57a? Für welche Fahrzeuge?", "answer": "• § 57a KFG regelt die periodische Begutachtung (Pickerl).\n• Sie gilt für alle Kraftfahrzeuge und Anhänger (mit bestimmten Ausnahmen\nwie Oldtimer). Für Taxis gelten keine verlängerten Intervalle.", "blocks": [{"type": "ul", "items": ["§ 57a KFG regelt die periodische Begutachtung (Pickerl).", "Sie gilt für alle Kraftfahrzeuge und Anhänger (mit bestimmten Ausnahmen wie Oldtimer). Für Taxis gelten keine verlängerten Intervalle."]}]}, {"num": 84, "question": "Was ist Preisband?", "answer": "In Wien beträgt das zulässige Preisband für per Kommunikationsdienst (z. B. App\noder Telefon) bestellte Taxifahrten ± 20 % gegenüber dem Betrag, der mit dem\nverbindlichen Tarif über Taxameter berechnet würde.\nDas heißt:\n• Zuerst wird ermittelt, wieviel die Fahrt im regulären Tarif kosten würde\n(Grundgebühr + Wegstrecken- + Zeittarif) für Abfahrts- und Zielort, Fahrtdauer\netc.\n• Danach darf der Preis bei einer solchen vorbestellten Fahrt maximal 20 %\ndarunter oder maximal 20 % darüber liegen.", "blocks": [{"type": "p_list", "paras": ["In Wien beträgt das zulässige Preisband für per Kommunikationsdienst (z. B. App oder Telefon) bestellte Taxifahrten ± 20 % gegenüber dem Betrag, der mit dem verbindlichen Tarif über Taxameter berechnet würde. Das heißt: (Grundgebühr + Wegstrecken- + Zeittarif) für Abfahrts- und Zielort, Fahrtdauer etc. darunter oder maximal 20 % darüber liegen."]}, {"type": "ul", "items": ["Zuerst wird ermittelt, wieviel die Fahrt im regulären Tarif kosten würde", "Danach darf der Preis bei einer solchen vorbestellten Fahrt maximal 20 %"]}]}]}, {"title": "Straßenverkehrsordnung (StVO), Kraftfahrgesetz (KFG)", "questions": [{"num": 85, "question": "Was ist der Vertrauensgrundsatz? Wer ist ausgenommen?", "answer": "• Man darf darauf vertrauen, dass sich andere an die Regeln halten.\nAusgenommen: • Kinder , Menschen mit Sehbehinderung mit weißem Stock oder\ngelber Armbinde, Betrunkene Personen,\nMenschen mit offensichtlicher körperliche Beeinträchtigung oder um Personen\nhandelt, aus deren augenfälligem Gehaben geschlossen werden muss, dass sie\nunfähig sind, die Gefahren des Straßenverkehrs einzusehen oder sich dieser Einsicht\ngemäß zu verhalten.", "blocks": [{"type": "p_list", "paras": ["Ausgenommen: • Kinder , Menschen mit Sehbehinderung mit weißem Stock oder gelber Armbinde, Betrunkene Personen, Menschen mit offensichtlicher körperliche Beeinträchtigung oder um Personen handelt, aus deren augenfälligem Gehaben geschlossen werden muss, dass sie unfähig sind, die Gefahren des Straßenverkehrs einzusehen oder sich dieser Einsicht gemäß zu verhalten."]}, {"type": "ul", "items": ["Man darf darauf vertrauen, dass sich andere an die Regeln halten."]}]}, {"num": 86, "question": "Was tun, wenn das Kennzeichen/Führerschein verloren geht? Darf man weiterfahren?", "answer": "• Sofort bei Polizei Verlust anzeigen.\n• Bei Verlust der Kennzeichentafel müssen Sie eine Verlustanzeige bei der\nPolizei machen und dürfen nur eine Woche mit einer selbstgemachten\nErsatztafel fahren, bis die neue Kennzeichentafel beantragt und erhalten\nwurde.\n• Ohne Führerschein darf man 4 Wochen fahren , mit Verlust Anzeige.", "blocks": [{"type": "ul", "items": ["Sofort bei Polizei Verlust anzeigen.", "Bei Verlust der Kennzeichentafel müssen Sie eine Verlustanzeige bei der Polizei machen und dürfen nur eine Woche mit einer selbstgemachten Ersatztafel fahren, bis die neue Kennzeichentafel beantragt und erhalten wurde.", "Ohne Führerschein darf man 4 Wochen fahren , mit Verlust Anzeige."]}]}, {"num": 87, "question": "Reifen: Mindestprofiltiefe (Sommer/Winter)? Situative Winterausrüstungspflicht?", "answer": "• Sommer: Gesetzlich min. 1,6 mm.\n• Winter : Radialreifen 4 mm, Diagonalreifen 5 mm .\n• Situative Pflicht: Bei winterlichen Verhältnissen (Schnee, Eis, etc.) müssen alle\nangetriebenen Räder Winterreifen haben. Zeitlich unbegrenzt.", "blocks": [{"type": "ul", "items": ["Sommer: Gesetzlich min. 1,6 mm.", "Winter : Radialreifen 4 mm, Diagonalreifen 5 mm .", "Situative Pflicht: Bei winterlichen Verhältnissen (Schnee, Eis, etc.) müssen alle angetriebenen Räder Winterreifen haben. Zeitlich unbegrenzt."]}]}, {"num": 88, "question": "Was ist eine Fußgängerzone? Darf ein Taxi einfahren?", "answer": "• Verkehrsfläche primär für Fußgänger.\n• Nur, wenn durch Zusatzzeichen erlaubt (z.B. \"Taxi frei\" oder mit Uhrzeiten).\nDann nur mit Schrittgeschwindigkeit 4-5 km/h zum Ein-/Aussteigenlassen.", "blocks": [{"type": "ul", "items": ["Verkehrsfläche primär für Fußgänger.", "Nur, wenn durch Zusatzzeichen erlaubt (z.B. \"Taxi frei\" oder mit Uhrzeiten). Dann nur mit Schrittgeschwindigkeit 4-5 km/h zum Ein-/Aussteigenlassen."]}]}, {"num": 89, "question": "Was ist eine Begegnungszone? (Geschwindigkeit)", "answer": "• Fußgänger dürfen die ganze Straße benutzen. Fahrzeuge nur\nmit Schrittgeschwindigkeit (max. 20 km/h). Fußgänger haben Vorrang.", "blocks": [{"type": "ul", "items": ["Fußgänger dürfen die ganze Straße benutzen. Fahrzeuge nur mit Schrittgeschwindigkeit (max. 20 km/h). Fußgänger haben Vorrang."]}]}, {"num": 90, "question": "Was ist eine Wohnstraße? (Geschwindigkeit, Regeln)", "answer": "• Vorrang für Fußgänger und spielende Kinder. Nur mit Schrittgeschwindigkeit\n(4-5 km/h). Durchfahren ist verboten, nur Anrainerverkehr. Parken nur in\ngekennzeichneten Flächen. Mann muss mindestens einmal stehen bleiben ,\nwenn man raus fährt von ein Wohnstraße hat man nachrang.", "blocks": [{"type": "ul", "items": ["Vorrang für Fußgänger und spielende Kinder. Nur mit Schrittgeschwindigkeit (4-5 km/h). Durchfahren ist verboten, nur Anrainerverkehr. Parken nur in gekennzeichneten Flächen. Mann muss mindestens einmal stehen bleiben , wenn man raus fährt von ein Wohnstraße hat man nachrang."]}]}, {"num": 91, "question": "Überholverbote? (Verkehrsschilder) 🚫", "answer": "• Zeichen 104: Absolutes Überholverbot für alle KFZ.\n• Zeichen 105: Überholverbot für LKW.\n• Blaues Schild mit rotem Rand und weißem Auto: Ende des Überholverbots.", "blocks": [{"type": "ul", "items": ["Zeichen 104: Absolutes Überholverbot für alle KFZ.", "Zeichen 105: Überholverbot für LKW.", "Blaues Schild mit rotem Rand und weißem Auto: Ende des Überholverbots."]}]}, {"num": 92, "question": "Verkehrsschild \"Blaue Ecke, Schild 17\"? (Autobahn)", "answer": "Das \"Verkehrsschild 'Blaue Ecke, Schild 17'\" bezieht sich höchstwahrscheinlich auf\ndas österreichische\nSchild 17 „L 17“ (weißes „L 17“ auf blauem Grund) für Ausbildungsfahrten mit\nvorgezogener Lenkerberechtigung, bei denen ein Begleiter mitfährt, um zu lernen,\noder auf blaue «U»-Schilder (Bedarfsumleitungen) auf Autobahnen, aber auch auf\ndas blaue Schild 52/17 (Geh- und Radweg), das eine gemeinsame Nutzung\nvorschreibt; es ist wichtig zu wissen, ob es ein Fahrzeug-Aufkleber oder\nein Straßenverkehrszeichen ist, da die Bedeutungen stark variieren.", "blocks": [{"type": "p_list", "paras": ["Das \"Verkehrsschild 'Blaue Ecke, Schild 17'\" bezieht sich höchstwahrscheinlich auf das österreichische Schild 17 „L 17“ (weißes „L 17“ auf blauem Grund) für Ausbildungsfahrten mit vorgezogener Lenkerberechtigung, bei denen ein Begleiter mitfährt, um zu lernen, oder auf blaue «U»-Schilder (Bedarfsumleitungen) auf Autobahnen, aber auch auf das blaue Schild 52/17 (Geh- und Radweg), das eine gemeinsame Nutzung vorschreibt; es ist wichtig zu wissen, ob es ein Fahrzeug-Aufkleber oder ein Straßenverkehrszeichen ist, da die Bedeutungen stark variieren."]}]}, {"num": 93, "question": "Verkehrsschild \"IG-L\"? (Ende der Autobahn)", "answer": "Das Verkehrsschild \"IG-L\" in Österreich\nweist auf eine Geschwindigkeitsbeschränkung von 100 km/h hin, die durch\ndas Immissionsschutzgesetz-Luft begründet ist, um die Luftqualität zu verbessern,\nwobei reine Elektro- und Wasserstofffahrzeuge mit grünem Kennzeichen davon\nausgenommen sind und weiterhin 130 km/h (oder die allgemeine\nHöchstgeschwindigkeit) fahren dürfen. Es erscheint als Zusatztafel unter einem\nnormalen Tempolimit (z. B. 100) und gilt hauptsächlich auf Autobahnen und\nSchnellstraßen.", "blocks": [{"type": "p_list", "paras": ["Das Verkehrsschild \"IG-L\" in Österreich weist auf eine Geschwindigkeitsbeschränkung von 100 km/h hin, die durch das Immissionsschutzgesetz-Luft begründet ist, um die Luftqualität zu verbessern, wobei reine Elektro- und Wasserstofffahrzeuge mit grünem Kennzeichen davon ausgenommen sind und weiterhin 130 km/h (oder die allgemeine Höchstgeschwindigkeit) fahren dürfen. Es erscheint als Zusatztafel unter einem normalen Tempolimit (z. B. 100) und gilt hauptsächlich auf Autobahnen und Schnellstraßen."]}]}, {"num": 94, "question": "Was ist die Lenkerauskunft? Was ist eine Anonymverfügung?", "answer": "Die Lenkerauskunft\nist eine behördliche Aufforderung an den Fahrzeughalter, den tatsächlichen Fahrer\neines Fahrzeugs zu einem bestimmten Zeitpunkt zu nennen, wenn ein Verstoß\nfestgestellt wurde, der eine einfache Anonymverfügung übersteigt. Eine\nAnonymverfügung\nist eine einfachere Form der Verwaltungsstrafe für geringfügige Übertretungen (z. B.\nFalschparken), bei der der Fahrer anonym bleibt und der Zulassungsbesitzer die\nStrafe mit einem geringeren Betrag bezahlt, um das Verfahren abzuschließen. Der\nHauptunterschied: Bei der Lenkerauskunft muss der tatsächliche Lenker genannt\nwerden (auch wenn es man selbst ist), während bei der Anonymverfügung der Täter\nunbekannt bleibt und der Fall durch Zahlung erledigt ist.", "blocks": [{"type": "p_list", "paras": ["Die Lenkerauskunft ist eine behördliche Aufforderung an den Fahrzeughalter, den tatsächlichen Fahrer eines Fahrzeugs zu einem bestimmten Zeitpunkt zu nennen, wenn ein Verstoß festgestellt wurde, der eine einfache Anonymverfügung übersteigt. Eine Anonymverfügung ist eine einfachere Form der Verwaltungsstrafe für geringfügige Übertretungen (z. B. Falschparken), bei der der Fahrer anonym bleibt und der Zulassungsbesitzer die Strafe mit einem geringeren Betrag bezahlt, um das Verfahren abzuschließen. Der Hauptunterschied: Bei der Lenkerauskunft muss der tatsächliche Lenker genannt werden (auch wenn es man selbst ist), während bei der Anonymverfügung der Täter unbekannt bleibt und der Fall durch Zahlung erledigt ist."]}]}, {"num": 95, "question": "Geschwindigkeitsbeschränkungen in Österreich? (Ortsgebiet, Freiland, Autobahn, etc.)", "answer": "• Ortsgebiet: 50 km/h\n• Freilandstraße: 100 km/h\n• Autobahn/Schnellstraße: 130 sweg ≈ (Geschwindigkeit / 10)² (in Metern)\n• Anhalteweg = Reaktionsweg + Bremsweg\n• *Beispiel 50 km/h:* Reaktionsweg 15m + Bremsweg 25m = Anhalteweg 40m.", "blocks": [{"type": "ul", "items": ["Reaktionsweg ≈ (Geschwindigkeit / 10) * 3 (in Metern)", "Bremsweg ≈ (Geschwindigkeit / 10)² (in Metern)", "Anhalteweg = Reaktionsweg + Bremsweg", "*Beispiel 50 km/h:* Reaktionsweg 15m + Bremsweg 25m = Anhalteweg 40m."]}]}, {"num": 98, "question": "Welche Fahrzeuge dürfen die Busspur benutzen? (Taxi?)", "answer": "• Einsatzfahrzeuge ,und wenn es durch Zusatzzeichen erlaubt ist (z.B. \"Taxi\",\n\"Radfahrer frei\"). Ohne Zusatzzeichen dürfen nur Linienbusse die Busspur\nbenutzen.", "blocks": [{"type": "ul", "items": ["Einsatzfahrzeuge ,und wenn es durch Zusatzzeichen erlaubt ist (z.B. \"Taxi\", \"Radfahrer frei\"). Ohne Zusatzzeichen dürfen nur Linienbusse die Busspur benutzen."]}]}, {"num": 99, "question": "Verkehrszeichen erklären: \"Vorrang geben\", \"Vorrangstraße\", \"Kreuzung\", \"Gegenverkehr vorrang\", \"Mindestgeschwindigkeit 30\", \"Mehrspurige KFZ verboten\".", "answer": "• \"Vorrang geben\" (Dreieck rot/weiß): Nachrang.\n• \"Vorrangstraße\" (Gelbes Quadrat mit weißem Rand): Man hat Vorrang.\n• \"Kreuzung\" (Gelbes Dreieck mit Kreuz): Unübersichtliche Kreuzung.\n• \"Gegenverkehr vorrang\" (Blauer Kreis mit weißen Pfeilen): Der\nGegenverkehr hat Vorrang.\n• \"Mindestgeschwindigkeit 30\" (Blauer Kreis mit \"30\"): Mindestens 30 km/h\nfahren.\n• \"Mehrspurige KFZ verboten\" (Roter Kreis mit 2 Autos): Verbot für\nmehrspurige Kraftfahrzeuge.", "blocks": [{"type": "ul", "items": ["\"Vorrang geben\" (Dreieck rot/weiß): Nachrang.", "\"Vorrangstraße\" (Gelbes Quadrat mit weißem Rand): Man hat Vorrang.", "\"Kreuzung\" (Gelbes Dreieck mit Kreuz): Unübersichtliche Kreuzung.", "\"Gegenverkehr vorrang\" (Blauer Kreis mit weißen Pfeilen): Der Gegenverkehr hat Vorrang.", "\"Mindestgeschwindigkeit 30\" (Blauer Kreis mit \"30\"): Mindestens 30 km/h fahren.", "\"Mehrspurige KFZ verbote en den normalen", "Kinder unter 14 Jahren/unter 135 cm: Sind gesetzlich von", "Besonderheit bei Taxis: Der Fahrer ist von der allgemeinen Gurtpflicht befreit,"]}]}, {"num": 105, "question": "Was bedeutet eine gelbe Linie am Fahrbahnrand?", "answer": "• Durchgezogene gelbe Linie: Absolutes Halte- und Parkverbot.\n• Gestreichelte gelbe Linie: Parkverbot, Halten ist kurz erlaubt.", "blocks": [{"type": "ul", "items": ["Durchgezogene gelbe Linie: Absolutes Halte- und Parkverbot.", "Gestreichelte gelbe Linie: Parkverbot, Halten ist kurz erlaubt."]}]}, {"num": 106, "question": "Wie viele Gesellschafter gibt es? (bei OG/KG)", "answer": "• OG: Mindestens 2 Gesellschafter.\n• KG: Mindestens 2 Gesellschafter (1 Komplementär, 1 Kommanditist).", "blocks": [{"type": "ul", "items": ["OG: Mindestens 2 Gesellschafter.", "KG: Mindestens 2 Gesellschafter (1 Komplementär, 1 Kommanditist)."]}]}, {"num": 107, "question": "Welche nimmt die Schaden falls Unfall passiert und warum?", "answer": "Bei einem Autounfall hängt die Schadensregulierung maßgeblich von der\nSchuldfrageund der Art Ihrer Versicherung ab:\n1. Schäden am gegnerischen Fahrzeug/Besitz\n• Welche Versicherung: Ihre gesetzlich vorgeschriebene Kfz-\nHaftpflichtversicherung.\n• Warum: Sie ist dafür da, die finanziellen Ansprüche Dritter zu decken, wenn Sie\neinen Schaden verursachen.\n• Ablauf: Wenn Sie den Unfall verschulden, übernimmt Ihre Haftpflicht die\nKosten für Reparaturen am gegnerischen Auto sowie mögliche Personen- oder\nSachschäden des Opfers.\n2. Schäden am eigenen Fahrzeug\n• Bei Fremdverschulden: Die Kfz-Haftpflicht des Unfallgegners muss Ihren\nSchaden vollständig bezahlen.\n• Bei Eigenverschulden: Hier greift nur eine freiwillige Kaskoversicherung.\no Vollkasko: Übernimmt Unfallschäden am eigenen Auto, auch wenn Sie\nden Unfall selbst verursacht haben (außer bei Vorsatz oder grober\nFahrlässigkeit).\no Teilkasko: Zahlt bei Unfällen mit Tieren (Wildschäden), aber in der\nRegel nicht bei selbst verschuldeten Kollisionen mit anderen Autos.\n3. Sonderfall: Teilschuld\n• Haben beide Fahrer eine Mitschuld, regulieren die Versicherungen die\nKosten anteilignach der jeweiligen Haftungsquote.", "blocks": [{"type": "p_list", "paras": ["Bei einem Autounfall hängt die Schadensregulierung maßgeblich von der Schuldfrageund der Art Ihrer Versicherung ab: 1. Schäden am gegnerischen Fahrzeug/Besitz Haftpflichtversicherung. einen Schaden verursachen. Kosten für Reparaturen am gegnerischen Auto sowie mögliche Personen- oder Sachschäden des Opfers. 2. Schäden am eigenen Fahrzeug Schaden vollständig bezahlen. o Vollkasko: Übernimmt Unfallschäden am eigenen Auto, auch wenn Sie den Unfall selbst verursacht haben (außer bei Vorsatz oder grober Fahrlässigkeit). o Teilkasko: Zahlt bei Unfällen mit Tieren (Wildschäden), aber in der Regel nicht bei selbst verschuldeten Kollisionen mit anderen Autos. 3. Sonderfall: Teilschuld Kosten anteilignach der jeweiligen Haftungsquote."]}, {"type": "ul", "items": ["Welche Versicherung: Ihre gesetzlich vorgeschriebene Kfz-", "Warum: Sie ist dafür da, die finanziellen Ansprüche Dritter zu decken, wenn Sie", "Ablauf: Wenn Sie den Unfall verschulden, übernimmt Ihre Haftpflicht die", "Bei Fremdverschulden: Die Kfz-Haftpflicht des Unfallgegners muss Ihren", "Bei Eigenverschulden: Hier greift nur eine freiwillige Kaskoversicherung.", "Haben beide Fahrer eine Mitschuld, regulieren die Versicherungen die"]}]}, {"num": 108, "question": "Wer ist zuständig für Nachweise der Landesbetriebsordnung?", "answer": "• Die Landesregierung erlässt die LBO. Die Überwachung obliegt den\nBezirksverwaltungsbehörden (MBA) und der Polizei.", "blocks": [{"type": "ul", "items": ["Die Landesregierung erlässt die LBO. Die Überwachung obliegt den Bezirksverwaltungsbehörden (MBA) und der Polizei."]}]}, {"num": 109, "question": "Wie schleppt man ein Auto mit einer Stange? (praktische Vorgehensweise)", "answer": "1. Stange fest verbinden. 2. Max. 40 km/h. 3. Gezogenes Fahrzeug muss\nbremsen/lenk efindet und es mindestens zwei\ndurch Leit- oder Sperrlinien gekennzeichneten Fahrstreifen in der eigenen\nFahrtrichtung gibt.", "blocks": [{"type": "p_list", "paras": ["Unter der „freien Wahl des Fahrstreifens“ versteht man, dass man den Fahrstreifen frei wählen darf, wenn man sich im Ortsgebiet befindet und es mindestens zwei durch Leit- oder Sperrlinien gekennzeichneten Fahrstreifen in der eigenen Fahrtrichtung gibt."]}]}, {"num": 115, "question": "Wie hoch ist der Taggeld?", "answer": "10 € pro Kalendertag", "blocks": [{"type": "p_list", "paras": ["10 € pro Kalendertag"]}]}, {"num": 116, "question": "Was bedeutet Delikte und Vormerkung?", "answer": "• Delikt: Strafbare Handlung.\n• Vormerkung (Strafregister): Eintrag, dass ein Verfahren läuft, aber noch kein\nUrteil gefällt wurde. Für gewerbliche Zuverlässigkeit sind rechtskräftige\nVerurteilungen relevant, nicht Vormerkungen.", "blocks": [{"type": "ul", "items": ["Delikt: Strafbare Handlung.", "Vormerkung (Strafregister): Eintrag, dass ein Verfahren läuft, aber noch kein Urteil gefällt wurde. Für gewerbliche Zuverlässigkeit sind rechtskräftige Verurteilungen relevant, nicht Vormerkungen."]}]}, {"num": 117, "question": "Nennen Sie drei Heurigenorte?", "answer": "• Nördlich: Stammersdorf, Strebersdorf und Mauer", "blocks": [{"type": "ul", "items": ["Nördlich: Stammersdorf, Strebersdorf und Mauer"]}]}, {"num": 118, "question": "Was bedeutet 'verbindlicher Tarif'? (Wiederholung zur Sicherheit)", "answer": "• Ein vom Landeshauptmann festgesetzter, zwingend anzuwendender Tarif.\nFahrten von Standplatz müssen mit Taxameter außer Botenfahrt oder\naußerhalb Stadt Grenze .", "blocks": [{"type": "ul", "items": ["Ein vom Landeshauptmann festgesetzter, zwingend anzuwendender Tarif. Fahrten von Standplatz müssen mit Taxameter außer Botenfahrt oder außerhalb Stadt Grenze ."]}]}, {"num": 119, "question": "Wie erkennt man ein Taxi? (am Dachschild) Taxifahrzeuge müssen wie folgt gekennzeichnet sein :", "answer": "• Mit einem Schild ( mind. 230 x 90 mm ) von innen beleuchtet und gut sichtbar , und mit der\nvon vorne als auch von hinten wahrnehmbarer Aufschrift “ TAXI “. Die Aufschrift “ TAXI “\nhat in gelber Schrift auf schwarzem Untergrund zu erfolgen.", "blocks": [{"type": "ul", "items": ["Mit einem Schild ( mind. 230 x 90 mm ) von innen beleuchtet und gut sichtbar , und mit der von vorne als auch von hinten wahrnehmbarer Aufschrift “ TAXI “. Die Aufschrift “ TAXI “ hat in gelber Schrift auf schwarzem Untergrund zu erfolgen."]}]}, {"num": 120, "question": "Dürfen Taxis in die Fußgängerzone? Von wann bis wann?", "answer": "• Taxis dürfen in Fußgängerzonen einfahren, jedoch nur wenn eine Zusatztafel\ndies erlaubt oder wenn es zum Abholen oder Bringen von Fahrgästen oder zur\nLadetätigkeit notwendig ist.\n• Nur, wenn durch Zusatzzeichen erlaubt (z.B. \"Taxi frei 6 – 10:30 Uhr\"). Die\ngenauen Zeiten stehen immer auf dem Zusatzschild.", "blocks": [{"type": "ul", "items": ["Taxis dürfen in Fußgängerzonen einfahren, jedoch nur wenn eine Zusatztafel dies erlaubt oder wenn es zum Abholen oder Bringen von Fahrgästen oder zur Ladetätigkeit notwendig ist.", "Nur, wenn durch Zusatzzeichen erlaubt (z.B. \"Taxi frei 6 – 10:30 Uhr\"). Die genauen Zeiten stehen immer auf dem Zusatzschild."]}]}, {"num": 121, "question": "Warum sind sie heute zu uns gekommen?", "answer": "• Um die Konzessionsprüfung für das Taxigewerbe abzulegen und\ndie fachliche Befähigung nachzuweisen.", "blocks": [{"type": "ul", "items": ["Um die Konzessionsprüfung für das Taxigewerbe abzulegen und die fachliche Befähigung nachzuweisen."]}]}, {"num": 122, "question": "Was ist Gelegenheitsverkehrsgesetz? (Wiederholung zur Sicherheit)", "answer": "• GTG. Regelt grenzüberschreitenden und bestimmten nationalen\nGelegenheitsverkehr, nicht das Taxigewerbe.", "blocks": [{"type": "ul", "items": ["GTG. Regelt grenzüberschreitenden und bestimmten nationalen Gelegenheitsverkehr, nicht das Taxigewerbe."]}]}, {"num": 123, "question": "Was ist Preis
